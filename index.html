<!DOCTYPE html>
<html>
<body>
<script>
fetch("https:///api/v2/members?expand=totalCountWithoutSelfOrOwner%2CcustomRoles", {
    method: "GET",
    credentials: "include"
})
.then(response => response.text())
.then(data => {
    document.body.innerText = data;
})
.catch(error => {
    document.body.innerText = "CORS blocked: " + error;
});
</script>
</body>
</html>
